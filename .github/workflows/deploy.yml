# Builds Bek's Base and publishes it to GitHub Pages every time you push to `main`.
# Watch it run in the repo's "Actions" tab. Only the app is published — never your data.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test # don't publish if the money maths tests fail
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
